<audio id="bgMusic" preload="auto" autoplay>
    <source src="https://zxcum.skysound7.com/t/04354483850184987231-zxcum-%D0%BD%D0%B5%D0%B3%D1%80%D1%8B-%D0%B8-%D0%BF%D0%B8%D0%B4%D0%BE%D1%80%D0%B0%D1%81%D1%8B/" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

music.volume = 1.0;

function startMusic() {
    music.currentTime = 16;

    music.play().catch(() => {
        // Браузер заблокировал autoplay.
        // После первого клика/касания запускаем музыку.
    });
}

// Сразу после загрузки страницы
window.addEventListener("load", () => {
    startMusic();
});

// Если браузер запретил autoplay,
// запускаем после первого взаимодействия с сайтом.
["click", "touchstart", "keydown"].forEach(event => {
    document.addEventListener(event, () => {
        if (music.paused) {
            startMusic();
        }
    }, { once: true });
});
</script>
