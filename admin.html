<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deminaleksey | Админка</title>

    <link rel="icon" href="https://static-cdn.jtvnw.net/jtv_user_pictures/7c0d8f0f-5d8a-4a5d-9c7c-6c6f3b3f4e90-profile_image-300x300.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #32175c 0%, #160b2b 45%, #090510 100%);
            color: #fff;
            padding: 30px 15px;
        }

        .admin {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            font-weight: 800;
        }

        .header p {
            margin: 0;
            color: #a99bbd;
            font-size: 14px;
        }

        .section {
            background: rgba(24, 13, 43, 0.94);
            border: 1px solid #3d2460;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .3);
        }

        .section-title {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 17px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #4a2d70;
            border-radius: 12px;
            outline: none;
            background: #10091d;
            color: #fff;
            font-size: 15px;
            margin-bottom: 14px;
        }

        input:focus {
            border-color: #914cff;
            box-shadow: 0 0 0 3px rgba(145, 76, 255, .12);
        }

        .modes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .mode {
            padding: 12px;
            border-radius: 11px;
            border: 1px solid #402661;
            background: #150c24;
            color: #bcaecc;
            cursor: pointer;
            text-align: center;
            transition: .2s;
        }

        .mode:hover {
            border-color: #8750c9;
        }

        .mode.active {
            background: #6d32b5;
            border-color: #a25cff;
            color: #fff;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 13px 15px;
            margin-top: 9px;
            cursor: pointer;
            color: white;
            font-weight: 700;
            font-size: 14px;
            background: linear-gradient(135deg, #7136c5, #9c45ff);
            transition: .2s;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        button.danger {
            background: linear-gradient(135deg, #8d233f, #c93658);
        }

        button.gray {
            background: #292035;
        }

        .status {
            margin-top: 14px;
            padding: 11px 13px;
            border-radius: 10px;
            background: #10091b;
            color: #9f91b0;
            font-size: 13px;
            word-break: break-word;
        }

        /* MUSIC PLAYER */

        .music-player {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            user-select: none;

            background:
                linear-gradient(135deg, #25103e, #351458);

            border: 1px solid #7040a0;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, .25),
                inset 0 0 20px rgba(153, 71, 255, .08);

            transition: .2s;
        }

        .music-player:hover {
            transform: translateY(-2px);
            border-color: #a15cff;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, .35),
                0 0 25px rgba(143, 67, 255, .15);
        }

        .music-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: #6d32b5;
            font-size: 23px;
            flex-shrink: 0;
        }

        .music-info {
            flex: 1;
            min-width: 0;
        }

        .music-title {
            font-weight: 800;
            font-size: 15px;
        }

        .music-subtitle {
            margin-top: 4px;
            color: #a99ab7;
            font-size: 12px;
        }

        .music-play {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #914cff;
            font-size: 16px;
            flex-shrink: 0;
        }

        /* DEVELOPER MESSAGE */

        .developer-message {
            display: none;
            margin-top: 16px;
            padding: 22px 15px;
            text-align: center;
            border-radius: 16px;

            background:
                radial-gradient(circle at center, #32104e 0%, #15081f 70%);

            border: 1px solid #793fa2;

            box-shadow:
                0 0 30px rgba(169, 60, 255, .18),
                inset 0 0 25px rgba(120, 45, 170, .08);

            animation: messageAppear .45s ease;
        }

        .developer-message.show {
            display: block;
        }

        .message-title {
            font-size: 23px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 14px;
        }

        .message-line {
            color: #72577f;
            margin: 8px 0;
            letter-spacing: 2px;
        }

        .message-main {
            font-size: 19px;
            font-weight: 900;
            color: #ff6688;
            line-height: 1.3;
            text-transform: uppercase;
        }

        .message-bottom {
            font-size: 17px;
            font-weight: 900;
            margin-top: 10px;
            color: #d7a8ff;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: scale(.94) translateY(8px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            pointer-events: none;

            background: #21112f;
            border: 1px solid #70429a;
            padding: 12px 18px;
            border-radius: 12px;

            color: #fff;
            font-size: 14px;

            transition: .25s;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 10px;
            }

            .section {
                padding: 17px;
            }

            .header h1 {
                font-size: 25px;
            }

            .message-title {
                font-size: 20px;
            }

            .message-main {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="admin">

    <div class="header">
        <h1>🎛️ DEMINALEKSEY</h1>
        <p>Панель администратора</p>
    </div>

    <!-- ФОРС-ПОБЕДИТЕЛЬ -->
    <div class="section">

        <div class="section-title">
            🎯 Форс-победитель
        </div>

        <input
            type="text"
            id="forceNick"
            placeholder="Введите Twitch ник"
            autocomplete="off"
        >

        <div class="modes">
            <div class="mode active" data-mode="all" onclick="selectMode('all')">
                Все
            </div>

            <div class="mode" data-mode="messages" onclick="selectMode('messages')">
                Messages
            </div>

            <div class="mode" data-mode="ducks" onclick="selectMode('ducks')">
                Ducks
            </div>

            <div class="mode" data-mode="wheel" onclick="selectMode('wheel')">
                Wheel
            </div>
        </div>

        <button onclick="saveForceNick()">
            💾 Сохранить победителя
        </button>

        <button class="gray" onclick="clearForceNick()">
            🗑️ Убрать форс-победителя
        </button>

        <div class="status" id="forceStatus">
            Проверка Firebase...
        </div>

    </div>


    <!-- ИСТОРИЯ ПОБЕД -->
    <div class="section">

        <div class="section-title">
            🏆 История побед
        </div>

        <div class="status" id="winnerStatus">
            Загрузка...
        </div>

        <button class="danger" onclick="clearWinnersLog()">
            🗑️ Очистить историю побед
        </button>

        <button class="danger" onclick="clearWinnersBase()">
            🗑️ Очистить базу победителей
        </button>

        <button class="danger" onclick="clearAll()">
            ⚠️ Очистить всё
        </button>

    </div>


    <!-- МУЗЫКА -->
    <div class="section">

        <div class="section-title">
            🎵 Музыка
        </div>

        <div
            class="music-player"
            onclick="playMusic()"
        >

            <div class="music-icon">
                🎵
            </div>

            <div class="music-info">
                <div class="music-title">
                    ВКЛЮЧИТЬ МУЗЫКУ
                </div>

                <div class="music-subtitle">
                    Нажми, чтобы запустить
                </div>
            </div>

            <div
                class="music-play"
                id="playIcon"
            >
                ▶
            </div>

        </div>


        <!-- СООБЩЕНИЕ СКРЫТО ДО НАЖАТИЯ -->

        <div
            class="developer-message"
            id="developerMessage"
        >

            <div class="message-title">
                РАЗРАБОТЧИК<br>
                ПОШЕЛ СПАТЬ
            </div>

            <div class="message-line">
                -----------
            </div>

            <div class="message-main">
                DEMINALEKSEY, ТЫ ПИДОРАС
            </div>

            <div class="message-line">
                -----------
            </div>

            <div class="message-bottom">
                ИДИ СРАТЬ И СПАТЬ
            </div>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<!-- АУДИО -->

<audio
    id="bgMusic"
    preload="auto"
>
    <source
        src="https://zxcum.skysound7.com/t/04354483850184987231-zxcum-%D0%BD%D0%B5%D0%B3%D1%80%D1%8B-%D0%B8-%D0%BF%D0%B8%D0%B4%D0%BE%D1%80%D0%B0%D1%81%D1%8B/"
        type="audio/mpeg"
    >
</audio>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<script>

    // =========================
    // FIREBASE
    // =========================

    const firebaseConfig = {
        databaseURL: "https://malibash-8e9ef-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();

    const forceRef = db.ref("deminaleksey_panel/forceWinner");
    const winnersBaseRef = db.ref("deminaleksey_panel/winnersBase");
    const winnersLogRef = db.ref("deminaleksey_panel/winnersLog");


    // =========================
    // MODE
    // =========================

    let selectedMode = "all";


    function selectMode(mode) {

        selectedMode = mode;

        document.querySelectorAll(".mode").forEach(el => {
            el.classList.remove("active");
        });

        const selected = document.querySelector(
            `.mode[data-mode="${mode}"]`
        );

        if (selected) {
            selected.classList.add("active");
        }
    }


    // =========================
    // TOAST
    // =========================

    function showToast(message) {

        const toast = document.getElementById("toast");

        toast.textContent = message;
        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 2500);
    }


    // =========================
    // SAVE FORCE WINNER
    // =========================

    function saveForceNick() {

        const input = document.getElementById("forceNick");

        const nick = input.value.trim();

        if (!nick) {
            showToast("Введите Twitch ник");
            return;
        }

        forceRef.set({
            nick: nick,
            mode: selectedMode,
            timestamp: Date.now()
        })
        .then(() => {

            showToast("Победитель сохранён");

            document.getElementById("forceStatus").textContent =
                `Активный победитель: ${nick} | режим: ${selectedMode}`;

        })
        .catch(error => {

            console.error(error);

            showToast("Ошибка Firebase");
        });
    }


    // =========================
    // CLEAR FORCE WINNER
    // =========================

    function clearForceNick() {

        forceRef.remove()
        .then(() => {

            document.getElementById("forceStatus").textContent =
                "Форс-победитель отсутствует";

            showToast("Форс-победитель убран");

        })
        .catch(error => {

            console.error(error);

            showToast("Ошибка Firebase");
        });
    }


    // =========================
    // CLEAR WINNERS LOG
    // =========================

    function clearWinnersLog() {

        if (!confirm("Очистить историю побед?")) {
            return;
        }

        winnersLogRef.remove()
        .then(() => {

            showToast("История побед очищена");

        })
        .catch(error => {

            console.error(error);

            showToast("Ошибка Firebase");
        });
    }


    // =========================
    // CLEAR WINNERS BASE
    // =========================

    function clearWinnersBase() {

        if (!confirm("Очистить базу победителей?")) {
            return;
        }

        winnersBaseRef.remove()
        .then(() => {

            showToast("База победителей очищена");

        })
        .catch(error => {

            console.error(error);

            showToast("Ошибка Firebase");
        });
    }


    // =========================
    // CLEAR EVERYTHING
    // =========================

    function clearAll() {

        if (!confirm("ТОЧНО ОЧИСТИТЬ ВСЁ?")) {
            return;
        }

        Promise.all([
            forceRef.remove(),
            winnersBaseRef.remove(),
            winnersLogRef.remove()
        ])
        .then(() => {

            document.getElementById("forceStatus").textContent =
                "Форс-победитель отсутствует";

            showToast("Всё очищено");

        })
        .catch(error => {

            console.error(error);

            showToast("Ошибка Firebase");
        });
    }


    // =========================
    // FIREBASE LISTENER
    // =========================

    forceRef.on("value", snapshot => {

        const status = document.getElementById("forceStatus");

        if (!snapshot.exists()) {

            status.textContent =
                "Форс-победитель отсутствует";

            return;
        }

        const data = snapshot.val();

        status.textContent =
            `Активный победитель: ${data.nick || "—"} | режим: ${data.mode || "all"}`;

        document.getElementById("forceNick").value =
            data.nick || "";

        selectMode(data.mode || "all");
    });


    // =========================
    // WINNERS LOG LISTENER
    // =========================

    winnersLogRef.on("value", snapshot => {

        const status = document.getElementById("winnerStatus");

        if (!snapshot.exists()) {

            status.textContent =
                "История побед пуста";

            return;
        }

        const data = snapshot.val();

        let count = 0;

        if (Array.isArray(data)) {
            count = data.length;
        } else if (typeof data === "object") {
            count = Object.keys(data).length;
        }

        status.textContent =
            `Записей в истории: ${count}`;
    });


    // =========================
    // MUSIC
    // =========================

    const bgMusic = document.getElementById("bgMusic");
    const developerMessage =
        document.getElementById("developerMessage");
    const playIcon =
        document.getElementById("playIcon");

    bgMusic.volume = 0.5;


    function playMusic() {

        /*
         * Музыка всегда начинается
         * с 16-й секунды.
         */

        try {
            bgMusic.currentTime = 16;
        } catch (e) {
            console.log(e);
        }


        bgMusic.play()
            .then(() => {

                playIcon.textContent = "❚❚";

                developerMessage.classList.add("show");

            })
            .catch(error => {

                console.error(
                    "Не удалось запустить музыку:",
                    error
                );

                showToast(
                    "Не удалось загрузить музыку"
                );
            });
    }


    // =========================
    // MUSIC END
    // =========================

    bgMusic.addEventListener("ended", () => {

        playIcon.textContent = "▶";

    });


    // =========================
    // MUSIC ERROR
    // =========================

    bgMusic.addEventListener("error", () => {

        console.log(
            "Ошибка загрузки аудио"
        );

    });

</script>

</body>
</html>
