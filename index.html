<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт закрылся</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ff3b3b;
            text-shadow: 0 0 20px rgba(255, 59, 59, 0.6);
            animation: blink 1.5s infinite;
        }

        h2 {
            font-size: 2rem;
            margin-top: 30px;
            color: #aaaaaa;
            font-weight: 400;
        }

        .name {
            display: block;
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffcc00;
            margin-top: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Адаптив для телефонов */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            h2 { font-size: 1.2rem; }
            .name { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <h1>САЙТ ЗАКРЫЛСЯ<br>Я ОБОСРАЛСЯ</h1>

    <h2>
        <span class="name">deminaleksey</span>
        ИДИ СПАТЬ
    </h2>

</body>
</html>
